<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Test 1</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <img src="images/lama-svart.svg" alt="Svart lama">
            <nav>
                <a href="#typography">Typografi</a>
                <a href="#image">Bild</a>
                <a href="#list">Lista</a>
                <a href="#link">Länkar</a>
                <a href="#column">Kolumn</a>
                <a href="#row">Rad</a>
                <a href="#footer">Footer</a>
            </nav>
        </header>

        <main>
            <!--Typo section-->
            <section id="typography" class="box">
                <h2>Typografi</h2>
                <h1>Testsida</h1>
                <p>Detta är en testsida.</p>
            </section>

            <!--Image section-->
            <section id="image" class="box">
                <h2>Bild</h2>
                <img src="images/bild-stilleben.jpg" alt="Stilleben av frukter">
            </section>

            <!--List section-->
            <section id="list" class="box">
                <h2>Lista</h2>
                <ul class="list">
                    <li>Sak 1</li>
                    <li>Sak 2</li>
                    <li>Sak 3</li>
                </ul>
            </section>

            <!--Link section-->
            <section id="link" class="box">
                <h2>Länkar</h2>
                <a href="https://sv.wikipedia.org">Wikipedia</a>
                <a class="email" href="mailto:minna@sanderoth.se">minna@sanderoth.se</a>
            </section>

            <!--Column section-->
            <section id="column" class="box">
                <h2>Kolumn</h2>
                <div class="column">
                    <img src="images/k1.jpg" alt="Oljemålning av ett grönt landskap">
                    <img src="images/k2.jpg" alt="Oljemålning an an vas med rosor">
                    <img src="images/k3.jpg" alt="Oljemålning av en trädgård full med blommor och ett litet vitt hus">
                </div>
            </section>

            <!--Row section-->
            <section id="row" class="box">
                <h2>Rad</h2>
                <div class="row">
                    <img src="images/r1.jpg" alt="Oljemålning av en grön böljande kulle">
                    <img src="images/r2.jpg" alt="Oljemålning av en blommande äng">
                    <img src="images/r3.jpg" alt="Oljemålning av en kvinna med ett parasoll">
                </div>
            </section>
        </main>

        <!--Footer section-->
        <footer>
            <h2>Footer</h2>
            <img src="images/lama-vit.svg" alt="Vit lama">
        </footer>
    </body>
</html>
